version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Bump the Microsoft.Extensions.* packages together so their versions stay aligned.
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    # FluentAssertions 8+ requires a paid Xceed license; this MIT project stays on 7.x.
    ignore:
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
